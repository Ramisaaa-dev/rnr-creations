<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stylesheet.css">
  <title>RNR Pay</title>
</head>
<body>

  <header>
    <h1>
      Thank You for Supporting
      <br>
      Our Small Business!
    </h1>
  </header>

  <main>

    <!--====================================
        Top Payment Options
    =====================================-->

    <section id="payments-top" class="payments-top">

      <!-- Payment Methods -->
      <!-- Cash App -->
      <!-- Credit / Debit Card -->

      <a href="#" id="credit-card" class="payment-btn credit-card">
        Credit / Debit Card
      </a>

      <a href="#" id="cashapp" class="payment-btn cashapp">
        Cash App
      </a>

    </section>

    <!--====================================
        Directions
    =====================================-->

    <section class="directions">

      <h3>
        Choose your preferred payment method
      </h3>

    </section>

    <!--====================================
        Logo Section
    =====================================-->

    <section id="logo" class="logo">

      <img
        src="LOGO PlaceCard.png"
        alt="RNR Creations Logo">

      <h2>
        RNR Creations
      </h2>

      <p>
        Crafted with <em>Care</em>.
        <br>
        Made to <em>Share</em>.
      </p>

    </section>

    <!--====================================
        Bottom Payment Options
    =====================================-->

    <section id="payments-bottom" class="payments-bottom">

      <!-- Payment Methods -->
      <!-- PayPal -->
      <!-- Venmo -->

      <a href="#" id="paypal" class="payment-btn paypal">
        PayPal
      </a>

      <a href="#" id="venmo" class="payment-btn venmo">
        Venmo
      </a>

    </section>

    <!--====================================
        Future Products
        (Version 2)
    =====================================-->

    <section class="future-products">

    </section>

  </main>

  <!--====================================
      Footer
  =====================================-->

  <footer>

    <h4>

      Thank You

      <br>

      Love,

      <br>

      RNR Creations

    </h4>

  </footer>

</body>
</html>
